<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>عقارات العبور الجديدة</title>

https://cdn.jsdelivr.net/npm/@supabase/supabase-js>

<style>
body{font-family:Arial;background:#f5f5f5;margin:0}
header{background:#0F9D58;color:#fff;padding:15px;text-align:center}
.container{width:90%;max-width:1000px;margin:auto}
.card{background:#fff;padding:10px;margin:10px;border-radius:10px}
img{width:100%;border-radius:10px}
button{padding:10px;background:green;color:white;border:none;margin-top:5px;width:100%}
.delete{background:red}
.featured{border:3px solid gold}
</style>

</head>

<body>

<header>🏠 عقارات العبور الجديدة</header>

<div class="container">

<!-- 🔐 LOGIN -->
<div id="auth">
<input id="email" placeholder="اكتب الإيميل">
<button onclick="login()">دخول</button>
</div>

<!-- ➕ ADD -->
<div id="addBox" style="display:none;">
<input id="title" placeholder="عنوان">
<input id="price" placeholder="السعر">
<input id="desc" placeholder="الوصف">
<input id="lat" placeholder="lat">
<input id="lng" placeholder="lng">
<select id="type">
<option value="بيع">بيع</option>
<option value="إيجار">إيجار</option>
</select>
<input type="file" id="file">
<button onclick="add()">نشر</button>
</div>

<h3>⭐ إعلانات مميزة</h3>
<div id="featured"></div>

<h3>📋 كل الإعلانات</h3>
<div id="list"></div>

</div>

<script>

const client = supabase.createClient(
"https://mshsbgdsazycavbvgmbp.supabase.co",
"sb_publishable_lsvnFbezPvWjjhVKkbHSXQ_HSYgsjZf"
);

let user=null;

// ✅ login
async function login(){
  let email=document.getElementById("email").value;
  await client.auth.signInWithOtp({email});
  alert("تم إرسال لينك الدخول");
}

// ✅ check user
setTimeout(async ()=>{
  let {data}=await client.auth.getUser();
  if(data.user){
    user=data.user;
    document.getElementById("auth").style.display="none";
    document.getElementById("addBox").style.display="block";
  }
  load();
},2000);

// ✅ upload
async function upload(file){
 let name=Date.now()+file.name;
 await client.storage.from("images").upload(name,file);
 return `PUT_URL_HERE/storage/v1/object/public/images/${name}`;
}

// ✅ add
async function add(){
 let file=document.getElementById("file").files[0];
 let image=await upload(file);

 await client.from("properties").insert([{
  title:title.value,
  price:price.value,
  description:desc.value,
  lat:lat.value,
  lng:lng.value,
  type:type.value,
  image,
  user_id:user.id
 }]);

 load();
}

// ✅ delete
async function remove(id){
 await client.from("properties").delete().eq("id",id);
 load();
}

// ✅ feature (admin manually)
async function makeFeatured(id){
 await client.from("properties").update({featured:true}).eq("id",id);
 load();
}

// ✅ load
async function load(){

 let {data}=await client.from("properties").select("*");

 document.getElementById("featured").innerHTML=
 data.filter(p=>p.featured).map(card).join("");

 document.getElementById("list").innerHTML=
 data.map(card).join("");
}

// ✅ card
function card(p){
 return `
 <div class="card ${p.featured?'featured':''}">
  <img src="${p.imagep.title}</h3>
  <p>${p.price} جنيه</p>
  <p>${p.type}</p>

  <button onclick="openDetails('${p.id}')">عرض التفاصيل</button>

  ${
    user && user.id===p.user_id
    ? `<button class="delete" onclick="remove('${p.id}')">حذف</button>`
    : ``
  }

  <button onclick="makeFeatured('${p.id}')">⭐ تمييز</button>

 </div>
 `;
}

// ✅ details page
function openDetails(id){
 window.location.href="/details.html?id="+id;
}

load();

</script>

</body>
</html>
