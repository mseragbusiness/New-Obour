<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>عقارات العبور</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{font-family:Arial;margin:0;background:#f5f6f9}
.header{background:#0F9D58;color:white;padding:15px;text-align:center}
.container{max-width:1000px;margin:auto;padding:15px}
.box{background:white;padding:15px;margin-top:15px;border-radius:10px}
input,select{width:100%;padding:10px;margin-top:5px}
button{padding:10px;background:#0F9D58;color:white;border:none;margin-top:5px;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:white;border-radius:10px;overflow:hidden}
.card img{width:100%;height:150px;object-fit:cover}
</style>
</head>

<body>

<div class="header">🏠 عقارات العبور</div>

<div class="container">

<div class="box">
<h3>إنشاء حساب</h3>
<input id="name" placeholder="اسمك">
<input id="phone" placeholder="رقم الموبايل">
<input id="job" placeholder="وظيفتك">
<button onclick="register()">دخول</button>
</div>

<div class="box">
<h3>➕ إضافة عقار</h3>
<input id="title" placeholder="عنوان">
<input id="price" placeholder="السعر">
<input id="image" placeholder="رابط الصورة">

<select id="type">
<option>بيع</option>
<option>إيجار</option>
</select>

<button onclick="add()">نشر</button>
</div>

<h3>📋 الإعلانات</h3>
<div id="list" class="grid"></div>

</div>

<script>

const client = supabase.createClient(
  "https://mshsbgdsazycavbvgmbp.supabase.co",
  "sb_publishable_lsvnFbezPvWjjhVKkbHSXQ_HSYgsjZf"
);

let user = null;

// تسجيل مستخدم
async function register(){
  let nameVal = document.getElementById("name").value;
  let phoneVal = document.getElementById("phone").value;
  let jobVal = document.getElementById("job").value;

  if(!nameVal || !phoneVal){
    alert("اكمل البيانات");
    return;
  }

  let response = await client.from("users").insert([
    { name: nameVal, phone: phoneVal, job: jobVal }
  ]).select();

  user = response.data[0];

  alert("✅ تم تسجيلك");
}

// إضافة عقار
async function add(){

  if(!user){
    alert("سجل الأول");
    return;
  }

  await client.from("properties").insert([
    {
      title: title.value,
      price: price.value,
      image: image.value,
      type: type.value,
      user_id: user.id
    }
  ]);

  load();
}

// تحميل
async function load(){

  let { data } = await client.from("properties").select("*");

  document.getElementById("list").innerHTML =
    data.map(function(p){
      return '<div class="card" onclick="go("' + p.id + '")">' +
      '<img src="' + p.image + '">' +
      '<h4>' + p.title + '</h4>' +
      '<p>' + p.price + ' جنيه</p>' +
      '</div>';
    }).join("");

}

// انتقال
function go(id){
  location.href = "details.html?id=" + id;
}

load();

</script>

</body>
</html>
