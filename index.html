<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>عقارات العبور الجديدة</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body {
  font-family: Arial;
  background:#f5f5f5;
  text-align:center;
}
.card {
  background:white;
  padding:10px;
  margin:15px;
  border-radius:10px;
  box-shadow:0 0 10px #ccc;
}
input {
  padding:10px;
  margin:5px;
  width:200px;
}
button {
  padding:10px 15px;
  background:#008000;
  color:white;
  border:none;
  border-radius:5px;
}
</style>
</head>

<body>

<h1>🏠 عقارات العبور الجديدة</h1>

<div class="card">
<h2>➕ أضف عقار</h2>

<input id="title" placeholder="عنوان العقار"><br>
<input id="price" placeholder="السعر"><br>
<input id="image" placeholder="رابط الصورة"><br>

<button onclick="add()">نشر</button>
</div>

<div class="card">
<h2>📋 الإعلانات</h2>
<div id="list"></div>
</div>

<script>
const client = supabase.createClient(
"https://mshsbgdsazycavbvgmbp.supabase.co",
"sb_publishable_lsvnFbezPvWjjhVKkbHSXQ_HSYgsjZf"
);

async function add() {
  let title = document.getElementById("title").value;
  let price = document.getElementById("price").value;
  let image = document.getElementById("image").value;

  await client.from("properties").insert([{title,price,image}]);

  load();
}

async function remove(id){
  await client.from("properties").delete().eq("id", id);
  load();
}

async function load() {
  let { data } = await client.from("properties").select("*");

  document.getElementById("list").innerHTML = data.map(p => `
    <div class="card">
      <img src="${p.image}" width=".price} جنيه<br><br>
      <button onclick="remove('${p.id}')">حذف ❌</button>
    </div>
  `).join("");
}

load();
</script>

</body>
</html>
