<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>عقارات العبور الجديدة</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase
<style>
body{
  font-family: Arial;
  margin:0;
  background:#f2f3f5;
}

/* Header */
.header{
  background:#0F9D58;
  color:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
}

/* Container */
.container{
  width:90%;
  max-width:1100px;
  margin:auto;
}

/* Boxes */
.box{
  background:white;
  padding:15px;
  margin-top:15px;
  border-radius:10px;
}

/* Inputs */
input, select{
  width:100%;
  padding:10px;
  margin-top:5px;
}

/* Buttons */
button{
  padding:10px;
  margin-top:10px;
  border:none;
  background:#0F9D58;
  color:white;
}

/* Grid */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:10px;
}

/* Card */
.card{
  background:white;
  border-radius:10px;
  overflow:hidden;
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.card-content{
  padding:10px;
}

.price{
  color:green;
  font-weight:bold;
}
</style>

</head>

<body>

<!-- ✅ Header -->
<div class="header">
  <div>🏠 عقارات العبور</div>
  <div id="userBox"></div>
</div>

<div class="container">

<!-- ✅ Login -->
<div class="box" id="authBox">
<h3>تسجيل الدخول</h3>
<input id="email" placeholder="اكتب الإيميل">
<button onclick="login()">دخول</button>
</div>

<!-- ✅ Add -->
<div class="box" id="addBox" style="display:none">
<h3>➕ أضف عقار</h3>

<input id="title" placeholder="عنوان">
<input id="price" placeholder="السعر">
<input id="image" placeholder="رابط الصورة">

<select id="type">
<option>بيع</option>
<option>إيجار</option>
</select>

<button onclick="add()">نشر</button>
</div>

<!-- ✅ Search -->
<div class="box">
<input id="search" placeholder="ابحث...">
<button onclick="load()">بحث</button>
</div>

<h3>📋 الإعلانات</h3>
<div id="list" class="grid"></div>

</div>

<script>

const client = supabase.createClient(
"https://mshsbgdsazycavbvgmbp.supabase.co",
"sb_publishable_lsvnFbezPvWjjhVKkbHSXQ_HSYgsjZf"
);

let user=null;

// ✅ login
async function login(){
  let email=document.getElementById("email").value;
  await client.auth.signInWithOtp({email});
  alert("افتح اللينك اللي في الإيميل");
}

// ✅ check user
setTimeout(async ()=>{
  let {data}=await client.auth.getUser();
  if(data.user){
    user=data.user;
    document.getElementById("authBox").style.display="none";
    document.getElementById("addBox").style.display="block";
    document.getElementById("userBox").innerHTML="✅ Logged";
  }
  load();
},2000);

// ✅ add
async function add(){
  await client.from("properties").insert([{
    title:title.value,
    price:price.value,
    image:image.value,
    type:type.value,
    user_id:user.id
  }]);
  load();
}

// ✅ load
async function load(){

  let search=document.getElementById("search").value;

  let query = client.from("properties").select("*");

  if(search){
    query = query.ilike("title", `%${search}%`);
  }

  let {data}=await query;

  document.getElementById("list").innerHTML=data.map(p=>`
    <div class="card">
      <img src="${     <div class="card-content">
        <h4>${p.title}</h4>
        <p class="price">${p.price} جنيه</p>
        <p>${p.type}</p>
      </div>
    </div>
  `).join("");
}

load();

</script>

</body>
</html>
