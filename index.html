<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>عقارات العبور الجديدة</title>
https://cdn.jsdelivr.net/npm/@supabase/supabase-jsscript>
</head>

<body style="font-family:Arial; text-align:center;">

<h1>🏠 عقارات العبور الجديدة</h1>

<input id="title" placeholder="عنوان العقار"><br><br>
<input id="price" placeholder="السعر"><br><br>
<input id="image" placeholder="رابط الصورة"><br><br>

<button onclick="add()">نشر</button>

<h2>الإعلانات</h2>
<div id="list"></div>

<script>
const supabase = supabase.createClient(
"https://mshsbgdsazycavbvgmbp.supabase.co",
"sb_publishable_lsvnFbezPvWjjhVKkbHSXQ_HSYgsjZf"
);

async function add() {
let title = document.getElementById("title").value;
let price = document.getElementById("price").value;
let image = document.getElementById("image").value;

await supabase.from("properties").insert([{title,price,image}]);
load();
}

async function load() {
let { data } = await supabase.from("properties").select("*");
document.getElementById("list").innerHTML = data.map(p =>
`<div style="border:1px solid #ccc; margin:10px;">
${p.image}<br>
${p.title} - ${p.price}
</div>`
).join("");
}

load();
</script>

</body>
</html>
