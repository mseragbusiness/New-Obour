<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>لوحة التحكم</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

</head>

<body style="font-family:Arial;padding:20px">

<h2>📊 Dashboard</h2>

<p>عدد المستخدمين: <span id="u">0</span></p>
<p>عدد العقارات: <span id="p">0</span></p>

<div id="list"></div>

<script>

const client = supabase.createClient(
  "https://mshsbgdsazycavbvgmbp.supabase.co",
  "sb_publishable_lsvnFbezPvWjjhVKkbHSXQ_HSYgsjZf"
);

async function load(){

let { count:u } = await client.from("users")
.select("*",{count:"exact",head:true});

let { count:p } = await client.from("properties")
.select("*",{count:"exact",head:true});

document.getElementById("u").innerText=u;
document.getElementById("p").innerText=p;

let { data } = await client.from("properties").select("*");

document.getElementById("list").innerHTML =
data.map(i=>`<p>${i.title} - ${i.price}</p>`).join("");
}

load();

</script>

</body>
</html>
